name: Diag
on:
  workflow_dispatch:
    inputs:
      script: { default: 'chats.js' }
      img_paths: { default: '' }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run diag
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          IMG_PATHS: ${{ inputs.img_paths }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          export GCLOUD_PROJECT=vein-48ec8
          cd tools/diag && npm init -y >/dev/null && npm i firebase-admin@12 --no-audit --no-fund >/dev/null && node ${{ inputs.script || 'chats.js' }}
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-out
          path: tools/diag/out/
          if-no-files-found: ignore
          retention-days: 1
