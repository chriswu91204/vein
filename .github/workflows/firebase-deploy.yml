# 推到 main → 自動部署正式網站、資料庫規則、Email 通知（Cloud Functions）
# 開 Pull Request → 自動產生一個預覽網址（留言在 PR 裡），確認沒問題再合併
name: Deploy to Firebase
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preview channel (PR)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          expires: 7d
      - name: Live site (main)
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with:
          node-version: 22
      - name: Database & storage rules (main)
        if: github.event_name == 'push'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only firestore,storage --non-interactive
      # 讓網站可以讀取照片來產生分享圖（照片本來就是公開的，只開放讀取）
      - name: Storage CORS (main)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          gcloud storage buckets update gs://vein-48ec8.firebasestorage.app --cors-file=storage-cors.json --quiet
      # 設定好 Gmail 密碼與權限後，在 GitHub → Settings → Variables 新增 DEPLOY_FUNCTIONS = true 才會部署
      - name: Email notifications / Cloud Functions (main)
        if: github.event_name == 'push' && vars.DEPLOY_FUNCTIONS == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm --prefix functions install --no-audit --no-fund
          npx --yes firebase-tools@14 deploy --only functions:default --non-interactive --force
      # 手機推播（聊天、議價、日常管理提醒）：在 GitHub → Settings → Variables 新增 DEPLOY_PUSH = true 才會部署（需要 Blaze 方案）
      - name: Push notifications / Cloud Functions (main)
        if: github.event_name == 'push' && vars.DEPLOY_PUSH == 'true'
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LINE_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf 'LINE_CHANNEL_ID=2012159791\nLINE_CHANNEL_SECRET=%s\n' "$LINE_SECRET" > push/.env
          npm --prefix push install --no-audit --no-fund
          set -o pipefail
          npx --yes firebase-tools@14 deploy --only functions:push --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/push.log" || { grep -v "^\s*$" "$RUNNER_TEMP/push.log" | grep -viE "is enabled|ensuring required|^i  |Serving at|outdated|breaking changes|Deploying to" | tail -n 9 | while IFS= read -r l; do echo "::error title=push-deploy::$l"; done; exit 1; }
          npx --yes firebase-tools@14 functions:list --non-interactive 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -E "│|\|" | while IFS= read -r l; do echo "::notice title=functions::$l"; done || true
